name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Build wheel
        run: python -m build
      - name: Upload wheel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ github.run_number }}
          path: dist/*.whl
          if-no-files-found: error
